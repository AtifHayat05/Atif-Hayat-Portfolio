<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  fill="none"
>
  <!-- Dark background -->
  <rect
    width="100"
    height="100"
    rx="24"
    fill="#050B18"
  />

  <!-- Outer border -->
  <rect
    x="5"
    y="5"
    width="90"
    height="90"
    rx="20"
    stroke="#1D4ED8"
    stroke-width="2"
  />

  <!-- MA -->
  <text
    x="50"
    y="64"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="800"
    letter-spacing="-3"
    fill="#FFFFFF"
  >MA</text>

  <!-- Blue accent line -->
  <path
    d="M25 75H75"
    stroke="#3B82F6"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Small accent dots -->
  <circle cx="21" cy="75" r="2.5" fill="#60A5FA"/>
  <circle cx="79" cy="75" r="2.5" fill="#60A5FA"/>
</svg>